{% extends 'base.html' %}

{% block title %}Contact Us - MedTrack Healthcare Support{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Get in Touch</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
                Have questions or need technical support? Send us a message!
            </p>
        </div>

        <form action="{{ url_for('contact') }}" method="POST">
            <div class="form-group">
                <label for="name" class="form-label"><i class="fa-solid fa-user" style="color: var(--primary);"></i> Your Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Kusuma Sharma" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label"><i class="fa-solid fa-envelope" style="color: var(--primary);"></i> Your Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="xyz@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="subject" class="form-label"><i class="fa-solid fa-tag" style="color: var(--primary);"></i> Inquiry Subject</label>
                <input type="text" id="subject" name="subject" class="form-control" placeholder="e.g. Appointment assistance, Technical feedback" required>
            </div>

            <div class="form-group">
                <label for="message" class="form-label"><i class="fa-solid fa-comment" style="color: var(--primary);"></i> Message</label>
                <textarea id="message" name="message" class="form-control" placeholder="Type your inquiry or feedback message here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
                <i class="fa-solid fa-paper-plane"></i> Send Support Message
            </button>
        </form>
    </div>
</div>
{% endblock %}
